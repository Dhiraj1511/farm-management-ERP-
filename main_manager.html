<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm ERP Core</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(120deg,#e6f5ec,#cfead9);
}

.container{
    width:950px;
    height:540px;
    display:flex;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,0.15);
}

/* LEFT PANEL */
.left{
    width:50%;
    background: linear-gradient(135deg,#0f7a36,#0b5e2b);
    color:white;
    padding:60px 50px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h1{
    font-size:26px;
    margin-bottom:5px;
}

.powered{
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:45px;
}

.features{
    list-style:none;
}

.features li{
    margin-bottom:18px;
    font-size:14px;
}

.features li::before{
    content:"✔";
    margin-right:10px;
    color:#7dffb2;
}

/* RIGHT PANEL */
.right{
    width:50%;
    background:white;
    padding:55px 50px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.right h2{
    font-size:28px;
    margin-bottom:5px;
}

.subtitle{
    font-size:13px;
    color:#777;
    margin-bottom:25px;
}

form{
    display:flex;
    flex-direction:column;
}

label{
    margin-top:12px;
    margin-bottom:6px;
    font-size:13px;
    font-weight:500;
}

input, select{
    padding:12px;
    border-radius:8px;
    border:1px solid #ddd;
    font-size:14px;
    outline:none;
}

input:focus, select:focus{
    border-color:#0f7a36;
    box-shadow:0 0 0 2px rgba(15,122,54,0.15);
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    font-size:12px;
}

.options a{
    text-decoration:none;
    color:#0f7a36;
    font-weight:500;
}

.login-btn{
    margin-top:20px;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#157a3b,#0f5c2c);
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(0,0,0,0.15);
}

.divider{
    text-align:center;
    margin:18px 0;
    font-size:12px;
    color:#888;
}

.otp-btn{
    padding:11px;
    border-radius:10px;
    border:1px solid #ddd;
    background:#f5f5f5;
    cursor:pointer;
}

.otp-btn:hover{
    background:#ececec;
}

/* Responsive */
@media(max-width:900px){
    .container{
        flex-direction:column;
        height:auto;
        width:90%;
    }
    .left,
    .right{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="left">
        <h1>🌾 Farm ERP Core</h1>
        <div class="powered">POWERED BY DHIRAJ PATEL</div>

        <ul class="features">
            <li>Smart Crop & Season Management</li>
            <li>Real-time Labor & Inventory Tracking</li>
            <li>Automated Cost Allocation</li>
            <li>Secure Role-Based Access</li>
        </ul>
    </div>

    <div class="right">
        <h2>Welcome Back</h2>
        <div class="subtitle">
            Please enter your details to access your dashboard.
        </div>

        <form>
            <label>Select Role</label>
            <select>
                <option>Admin</option>
                <option selected>Manager</option>
                <option>Field Staff</option>
            </select>

            <label>Mobile Number or Email</label>
            <input type="text" value="admin@tekizz.com">

            <label>Password</label>
            <input type="password" value="password">

            <div class="options">
                <div>
                    <input type="checkbox" checked>
                    <span>Remember me</span>
                </div>
                <a href="#">Forgot password?</a>
            </div>

            <button class="login-btn">Secure Login</button>

            <div class="divider">OR</div>

            <button type="button" class="otp-btn">
                📱 Login with OTP (Field Staff)
            </button>
        </form>
    </div>

</div>

</body>
</html>
