<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm ERP Core - Field Staff Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(120deg,#e6f5ec,#cfead9);
}

/* Main Card */
.container{
    width:950px;
    height:520px;
    display:flex;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,0.15);
}

/* Left Section */
.left{
    width:50%;
    background:linear-gradient(135deg,#0f7a36,#0b5e2b);
    color:white;
    padding:60px 50px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h1{
    font-size:26px;
    margin-bottom:5px;
}

.powered{
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:50px;
    opacity:0.9;
}

.features{
    list-style:none;
}

.features li{
    margin-bottom:18px;
    font-size:14px;
}

.features li::before{
    content:"✔";
    margin-right:10px;
    color:#7dffb2;
}

/* Right Section */
.right{
    width:50%;
    background:#ffffff;
    padding:55px 50px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.right h2{
    font-size:28px;
    margin-bottom:10px;
}

.subtitle{
    font-size:13px;
    color:#666;
    margin-bottom:25px;
    line-height:1.6;
}

label{
    font-size:13px;
    font-weight:500;
    margin-bottom:6px;
}

input{
    padding:12px;
    border-radius:8px;
    border:1px solid #ddd;
    font-size:14px;
    width:100%;
    margin-bottom:20px;
    outline:none;
}

input:focus{
    border-color:#0f7a36;
    box-shadow:0 0 0 2px rgba(15,122,54,0.15);
}

/* Buttons */
.primary-btn{
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#157a3b,#0f5c2c);
    color:white;
    font-size:15px;
    cursor:pointer;
    margin-bottom:15px;
    transition:0.3s;
}

.primary-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(0,0,0,0.15);
}

.secondary-btn{
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    background:#f5f5f5;
    font-size:14px;
    cursor:pointer;
    transition:0.3s;
}

.secondary-btn:hover{
    background:#ececec;
}

/* Responsive */
@media(max-width:900px){
    .container{
        flex-direction:column;
        width:90%;
        height:auto;
    }
    .left, .right{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- Left Panel -->
    <div class="left">
        <h1>🌾 Farm ERP Core</h1>
        <div class="powered">POWERED BY DHIRAJ PATEL</div>

        <ul class="features">
            <li>Master Setup & Season Planning</li>
            <li>Real-time Labor & Tractor Tracking</li>
            <li>Inventory Auto-Deductions</li>
            <li>Complete Financial Traceability</li>
        </ul>
    </div>

    <!-- Right Panel -->
    <div class="right">
        <h2>Field Staff Login</h2>
        <div class="subtitle">
            Enter your registered mobile number. We will send a secure 4-digit OTP for quick access.
        </div>

        <label>Mobile Number</label>
        <input type="text" placeholder="+91 Enter mobile number">

        <button class="primary-btn">Send OTP via SMS</button>
        <button class="secondary-btn">Back to Standard Login</button>
    </div>

</div>

</body>
</html>
